<svg xmlns="http://www.w3.org/2000/svg" width="560" height="660" viewBox="0 0 560 660" role="img" aria-labelledby="title desc">
<title id="title">Mohamed Sarkouh terminal introduction</title>
<desc id="desc">Animated Linux-style terminal showing Mohamed&#x27;s identity, current focus, and mission, plus a decorative system status panel.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#101A32"/>
<stop offset=".52" stop-color="#080D1B"/>
<stop offset="1" stop-color="#050816"/>
</linearGradient>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#9D4EDD"/>
<stop offset=".5" stop-color="#FF4ECD"/>
<stop offset="1" stop-color="#00E5FF"/>
</linearGradient>
<linearGradient id="neural" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#FF4ECD"/>
<stop offset=".5" stop-color="#9D4EDD"/>
<stop offset="1" stop-color="#00E5FF"/>
</linearGradient>
<radialGradient id="aura" cx=".78" cy=".18" r=".82">
<stop offset="0" stop-color="#9D4EDD" stop-opacity=".22"/>
<stop offset=".42" stop-color="#00E5FF" stop-opacity=".06"/>
<stop offset="1" stop-color="#080D1B" stop-opacity="0"/>
</radialGradient>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
<feGaussianBlur stdDeviation="3" result="blur"/>
<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<style>
text{font-family:'Geist Mono','IBM Plex Mono','SFMono-Regular',Consolas,monospace}
.display{font-family:'Space Grotesk','Aptos Display','Segoe UI',sans-serif}
.reveal{opacity:0;animation:reveal .82s cubic-bezier(.22,1,.36,1) forwards}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s cubic-bezier(.22,1,.36,1) infinite}
.blink{animation:blink 1.15s cubic-bezier(.22,1,.36,1) infinite}
.scan{animation:scan 6.2s cubic-bezier(.22,1,.36,1) infinite}
.flow{stroke-dasharray:7 11;animation:flow 5s cubic-bezier(.22,1,.36,1) infinite}
.orbit-line{stroke-dasharray:8 13;animation:orbitFlow 10s linear infinite}
.orbit-line.reverse{animation-direction:reverse;animation-duration:13s}
.radar{transform-box:view-box;animation:radar 7.2s linear infinite}
.role{opacity:0;animation:role 15s cubic-bezier(.22,1,.36,1) infinite}
.r1{animation-delay:3s}.r2{animation-delay:6s}.r3{animation-delay:9s}.r4{animation-delay:12s}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.88)}50%{opacity:1;transform:scale(1.08)}}
@keyframes blink{0%,42%{opacity:1}58%,100%{opacity:.08}}
@keyframes scan{0%{opacity:0;transform:translateX(-160px)}14%{opacity:.7}62%,100%{opacity:0;transform:translateX(1050px)}}
@keyframes flow{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
@keyframes orbitFlow{from{stroke-dashoffset:84}to{stroke-dashoffset:0}}
@keyframes radar{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes role{0%,14%{opacity:1;transform:translateY(0)}18%,92%{opacity:0;transform:translateY(-8px)}96%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.reveal,.pulse,.blink,.scan,.flow,.orbit-line,.radar,.role{animation:none!important;opacity:1!important;transform:none!important}.r1,.r2,.r3,.r4{display:none!important}}
</style>
<rect x="4" y="4" width="552" height="652" rx="30" fill="#030510" stroke="#19254A"/>
<rect x="11" y="11" width="538" height="638" rx="24" fill="url(#bg)" stroke="#26365F"/>
<rect x="12" y="12" width="536" height="636" rx="23" fill="url(#aura)"/>
<circle cx="36" cy="36" r="5" fill="#FF5F57"/>
<circle cx="54" cy="36" r="5" fill="#FEBC2E"/>
<circle cx="72" cy="36" r="5" fill="#00FFA3"/>
<text x="96" y="41" fill="#91A4C5" font-size="12" letter-spacing="1.35">mohamed@lab:~ / zsh</text>
<line x1="24" y1="58" x2="536" y2="58" stroke="#223259"/>
<rect class="scan" x="24" y="59" width="150" height="1" fill="url(#brand)" opacity="0"/>
<text x="34" y="104" fill="#9D4EDD" font-size="14" font-weight="700" class="reveal" style="animation-delay:0.12s">$</text>
<text x="56" y="104" fill="#EAF4FF" font-size="13" font-weight="700" class="reveal" style="animation-delay:0.15s">whoami</text>
<text x="34" y="134" fill="#00FFA3" font-size="12" class="reveal" style="animation-delay:0.22s">&gt; AI Builder | Vibe Coder |</text>
<text x="56" y="156" fill="#91A4C5" font-size="12" class="reveal" style="animation-delay:0.26s">Cybersecurity Mindset</text>
<text x="34" y="210" fill="#9D4EDD" font-size="14" font-weight="700" class="reveal" style="animation-delay:0.36s">$</text>
<text x="56" y="210" fill="#EAF4FF" font-size="13" font-weight="700" class="reveal" style="animation-delay:0.39s">current_focus</text>
<text x="34" y="240" fill="#00FFA3" font-size="12" class="reveal" style="animation-delay:0.46s">&gt; AI Agents · Intelligent Automation</text>
<text x="56" y="262" fill="#91A4C5" font-size="12" class="reveal" style="animation-delay:0.50s">Secure Applications</text>
<text x="34" y="316" fill="#9D4EDD" font-size="14" font-weight="700" class="reveal" style="animation-delay:0.60s">$</text>
<text x="56" y="316" fill="#EAF4FF" font-size="13" font-weight="700" class="reveal" style="animation-delay:0.63s">mission</text>
<text x="34" y="346" fill="#00FFA3" font-size="12" class="reveal" style="animation-delay:0.70s">&gt; Build smarter. Automate faster.</text>
<text x="56" y="368" fill="#91A4C5" font-size="12" class="reveal" style="animation-delay:0.74s">Think securely.</text>
<rect x="28" y="426" width="504" height="188" rx="20" fill="#0A1227" stroke="#384575"/>
<text x="50" y="458" fill="#FF4ECD" font-size="9" font-weight="700" letter-spacing="0.7" class="reveal" style="animation-delay:0.50s">DECORATIVE SYSTEM STATUS</text>
<circle class="pulse" cx="52" cy="496" r="4" fill="#00E5FF"/>
<text x="68" y="500" fill="#91A4C5" font-size="10" class="reveal" style="animation-delay:0.62s">AI TOOLCHAIN</text>
<text x="462" y="500" fill="#00E5FF" font-size="10" font-weight="700" class="reveal" style="animation-delay:0.67s">ONLINE</text>
<circle class="pulse" cx="52" cy="538" r="4" fill="#00FFA3"/>
<text x="68" y="542" fill="#91A4C5" font-size="10" class="reveal" style="animation-delay:0.72s">SECURITY MODE</text>
<text x="462" y="542" fill="#00FFA3" font-size="10" font-weight="700" class="reveal" style="animation-delay:0.77s">ACTIVE</text>
<circle class="pulse" cx="52" cy="580" r="4" fill="#9D4EDD"/>
<text x="68" y="584" fill="#91A4C5" font-size="10" class="reveal" style="animation-delay:0.82s">NETWORK LAB</text>
<text x="462" y="584" fill="#9D4EDD" font-size="10" font-weight="700" class="reveal" style="animation-delay:0.87s">READY</text>
</svg>
