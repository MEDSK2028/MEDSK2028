<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
<title id="title">Mohamed Sarkouh terminal introduction</title>
<desc id="desc">Animated Linux-style terminal showing Mohamed&#x27;s identity, current focus, and mission, plus a decorative system status panel.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#101A32"/>
<stop offset=".52" stop-color="#080D1B"/>
<stop offset="1" stop-color="#050816"/>
</linearGradient>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#9D4EDD"/>
<stop offset=".5" stop-color="#FF4ECD"/>
<stop offset="1" stop-color="#00E5FF"/>
</linearGradient>
<linearGradient id="neural" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#FF4ECD"/>
<stop offset=".5" stop-color="#9D4EDD"/>
<stop offset="1" stop-color="#00E5FF"/>
</linearGradient>
<radialGradient id="aura" cx=".78" cy=".18" r=".82">
<stop offset="0" stop-color="#9D4EDD" stop-opacity=".22"/>
<stop offset=".42" stop-color="#00E5FF" stop-opacity=".06"/>
<stop offset="1" stop-color="#080D1B" stop-opacity="0"/>
</radialGradient>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
<feGaussianBlur stdDeviation="3" result="blur"/>
<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<style>
text{font-family:'Geist Mono','IBM Plex Mono','SFMono-Regular',Consolas,monospace}
.display{font-family:'Space Grotesk','Aptos Display','Segoe UI',sans-serif}
.reveal{opacity:0;animation:reveal .82s cubic-bezier(.22,1,.36,1) forwards}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s cubic-bezier(.22,1,.36,1) infinite}
.blink{animation:blink 1.15s cubic-bezier(.22,1,.36,1) infinite}
.scan{animation:scan 6.2s cubic-bezier(.22,1,.36,1) infinite}
.flow{stroke-dasharray:7 11;animation:flow 5s cubic-bezier(.22,1,.36,1) infinite}
.orbit-line{stroke-dasharray:8 13;animation:orbitFlow 10s linear infinite}
.orbit-line.reverse{animation-direction:reverse;animation-duration:13s}
.radar{transform-box:view-box;animation:radar 7.2s linear infinite}
.role{opacity:0;animation:role 15s cubic-bezier(.22,1,.36,1) infinite}
.r1{animation-delay:3s}.r2{animation-delay:6s}.r3{animation-delay:9s}.r4{animation-delay:12s}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.88)}50%{opacity:1;transform:scale(1.08)}}
@keyframes blink{0%,42%{opacity:1}58%,100%{opacity:.08}}
@keyframes scan{0%{opacity:0;transform:translateX(-160px)}14%{opacity:.7}62%,100%{opacity:0;transform:translateX(1050px)}}
@keyframes flow{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
@keyframes orbitFlow{from{stroke-dashoffset:84}to{stroke-dashoffset:0}}
@keyframes radar{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes role{0%,14%{opacity:1;transform:translateY(0)}18%,92%{opacity:0;transform:translateY(-8px)}96%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.reveal,.pulse,.blink,.scan,.flow,.orbit-line,.radar,.role{animation:none!important;opacity:1!important;transform:none!important}.r1,.r2,.r3,.r4{display:none!important}}
</style>
<rect x="4" y="4" width="952" height="462" rx="30" fill="#030510" stroke="#19254A"/>
<rect x="11" y="11" width="938" height="448" rx="24" fill="url(#bg)" stroke="#26365F"/>
<rect x="12" y="12" width="936" height="446" rx="23" fill="url(#aura)"/>
<circle cx="36" cy="36" r="5" fill="#FF5F57"/>
<circle cx="54" cy="36" r="5" fill="#FEBC2E"/>
<circle cx="72" cy="36" r="5" fill="#00FFA3"/>
<text x="96" y="41" fill="#91A4C5" font-size="12" letter-spacing="1.35">mohamed@lab:~ / zsh</text>
<line x1="24" y1="58" x2="936" y2="58" stroke="#223259"/>
<rect class="scan" x="24" y="59" width="150" height="1" fill="url(#brand)" opacity="0"/>
<text x="46" y="105" fill="#9D4EDD" font-size="15" font-weight="700" class="reveal" style="animation-delay:0.12s">$</text>
<text x="68" y="105" fill="#EAF4FF" font-size="14" font-weight="700" class="reveal" style="animation-delay:0.15s">whoami</text>
<text x="46" y="137" fill="#00FFA3" font-size="14" font-weight="700" class="reveal" style="animation-delay:0.22s">&gt;</text>
<text x="68" y="137" fill="#91A4C5" font-size="13" class="reveal" style="animation-delay:0.25s">AI Builder | Vibe Coder | Cybersecurity Mindset</text>
<text x="46" y="197" fill="#9D4EDD" font-size="15" font-weight="700" class="reveal" style="animation-delay:0.36s">$</text>
<text x="68" y="197" fill="#EAF4FF" font-size="14" font-weight="700" class="reveal" style="animation-delay:0.39s">current_focus</text>
<text x="46" y="229" fill="#00FFA3" font-size="14" font-weight="700" class="reveal" style="animation-delay:0.46s">&gt;</text>
<text x="68" y="229" fill="#91A4C5" font-size="13" class="reveal" style="animation-delay:0.49s">AI Agents · Intelligent Automation · Secure Applications</text>
<text x="46" y="289" fill="#9D4EDD" font-size="15" font-weight="700" class="reveal" style="animation-delay:0.60s">$</text>
<text x="68" y="289" fill="#EAF4FF" font-size="14" font-weight="700" class="reveal" style="animation-delay:0.63s">mission</text>
<text x="46" y="321" fill="#00FFA3" font-size="14" font-weight="700" class="reveal" style="animation-delay:0.70s">&gt;</text>
<text x="68" y="321" fill="#91A4C5" font-size="13" class="reveal" style="animation-delay:0.73s">Build smarter. Automate faster. Think securely.</text>
<rect class="blink" x="47" y="382" width="9" height="17" rx="2" fill="#00E5FF"/>
<rect x="674" y="84" width="244" height="330" rx="22" fill="#0A1227" stroke="#384575"/>
<text x="698" y="116" fill="#FF4ECD" font-size="9" font-weight="700" letter-spacing="0.75" class="reveal" style="animation-delay:0.20s">DECORATIVE SYSTEM STATUS</text>
<circle class="pulse" cx="700" cy="160" r="4" fill="#00E5FF"/>
<text x="716" y="164" fill="#91A4C5" font-size="10" letter-spacing="0.5" class="reveal" style="animation-delay:0.32s">AI TOOLCHAIN</text>
<text x="872" y="164" fill="#00E5FF" font-size="10" font-weight="700" class="reveal" style="animation-delay:0.38s">ONLINE</text>
<circle class="pulse" cx="700" cy="216" r="4" fill="#00FFA3"/>
<text x="716" y="220" fill="#91A4C5" font-size="10" letter-spacing="0.5" class="reveal" style="animation-delay:0.43s">SECURITY MODE</text>
<text x="872" y="220" fill="#00FFA3" font-size="10" font-weight="700" class="reveal" style="animation-delay:0.49s">ACTIVE</text>
<circle class="pulse" cx="700" cy="272" r="4" fill="#9D4EDD"/>
<text x="716" y="276" fill="#91A4C5" font-size="10" letter-spacing="0.5" class="reveal" style="animation-delay:0.54s">NETWORK LAB</text>
<text x="872" y="276" fill="#9D4EDD" font-size="10" font-weight="700" class="reveal" style="animation-delay:0.60s">READY</text>
<circle class="pulse" cx="700" cy="328" r="4" fill="#FF4ECD"/>
<text x="716" y="332" fill="#91A4C5" font-size="10" letter-spacing="0.5" class="reveal" style="animation-delay:0.65s">BUILD CHANNEL</text>
<text x="872" y="332" fill="#FF4ECD" font-size="10" font-weight="700" class="reveal" style="animation-delay:0.71s">OPEN</text>
<text x="698" y="392" fill="#63759B" font-size="8" class="reveal" style="animation-delay:0.85s">visual indicator / not telemetry</text>
</svg>
