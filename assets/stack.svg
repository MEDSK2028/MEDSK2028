<svg xmlns="http://www.w3.org/2000/svg" width="840" height="430" viewBox="0 0 840 430" role="img" aria-labelledby="title desc">
<title id="title">Mohamed Sarkouh technology stack</title>
<desc id="desc">Animated capability matrix for AI engineering, full-stack development, automation, and infrastructure.</desc>
<defs>
<linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#091814"/>
<stop offset="0.55" stop-color="#050b09"/>
<stop offset="1" stop-color="#061510"/>
</linearGradient>
<radialGradient id="signal" cx="0.18" cy="0.1" r="0.85">
<stop offset="0" stop-color="#35f2a1" stop-opacity=".13"/>
<stop offset=".48" stop-color="#43d9ff" stop-opacity=".025"/>
<stop offset="1" stop-color="#000" stop-opacity="0"/>
</radialGradient>
