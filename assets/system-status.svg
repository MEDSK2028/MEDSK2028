<text x="538" y="170" fill="#EAF4FF" font-size="12" font-weight="700" class="reveal" style="animation-delay:0.32s">SECURE AI-ASSISTED APPLICATIONS</text>
<text x="538" y="194" fill="#91A4C5" font-size="10" class="reveal" style="animation-delay:0.37s">Fast prototypes with security-aware architecture.</text>
