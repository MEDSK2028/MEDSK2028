<text x="62" y="173" fill="#35f2a1" font-size="20" font-weight="700" letter-spacing="1.4" class="reveal" style="animation-delay:0.21s">###  ###  ##      </text>
<text x="62" y="204" fill="#35f2a1" font-size="20" font-weight="700" letter-spacing="1.4" class="reveal" style="animation-delay:0.30s">## ## ##   ###### </text>
