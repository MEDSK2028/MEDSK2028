<svg xmlns="http://www.w3.org/2000/svg" width="560" height="860" viewBox="0 0 560 860" role="img" aria-labelledby="title desc">
<title id="title">Mohamed Sarkouh currently building and decorative cybersecurity radar</title>
<desc id="desc">A decorative animated security radar beside a currently-building panel for AI applications, automation, and cybersecurity labs.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#101A32"/>
<stop offset=".52" stop-color="#080D1B"/>
<stop offset="1" stop-color="#050816"/>
</linearGradient>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#9D4EDD"/>
<stop offset=".5" stop-color="#FF4ECD"/>
<stop offset="1" stop-color="#00E5FF"/>
</linearGradient>
<linearGradient id="neural" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#FF4ECD"/>
<stop offset=".5" stop-color="#9D4EDD"/>
<stop offset="1" stop-color="#00E5FF"/>
</linearGradient>
<radialGradient id="aura" cx=".78" cy=".18" r=".82">
<stop offset="0" stop-color="#9D4EDD" stop-opacity=".22"/>
<stop offset=".42" stop-color="#00E5FF" stop-opacity=".06"/>
<stop offset="1" stop-color="#080D1B" stop-opacity="0"/>
</radialGradient>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
<feGaussianBlur stdDeviation="3" result="blur"/>
<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<style>
text{font-family:'Geist Mono','IBM Plex Mono','SFMono-Regular',Consolas,monospace}
.display{font-family:'Space Grotesk','Aptos Display','Segoe UI',sans-serif}
.reveal{opacity:0;animation:reveal .82s cubic-bezier(.22,1,.36,1) forwards}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s cubic-bezier(.22,1,.36,1) infinite}
.blink{animation:blink 1.15s cubic-bezier(.22,1,.36,1) infinite}
.scan{animation:scan 6.2s cubic-bezier(.22,1,.36,1) infinite}
.flow{stroke-dasharray:7 11;animation:flow 5s cubic-bezier(.22,1,.36,1) infinite}
.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 16s cubic-bezier(.45,.05,.55,.95) infinite}
.radar{transform-box:fill-box;transform-origin:center;animation:radar 6s cubic-bezier(.45,.05,.55,.95) infinite}
.role{opacity:0;animation:role 15s cubic-bezier(.22,1,.36,1) infinite}
.r1{animation-delay:3s}.r2{animation-delay:6s}.r3{animation-delay:9s}.r4{animation-delay:12s}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.88)}50%{opacity:1;transform:scale(1.08)}}
@keyframes blink{0%,42%{opacity:1}58%,100%{opacity:.08}}
@keyframes scan{0%{opacity:0;transform:translateX(-160px)}14%{opacity:.7}62%,100%{opacity:0;transform:translateX(1050px)}}
@keyframes flow{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
@keyframes orbit{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes radar{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes role{0%,14%{opacity:1;transform:translateY(0)}18%,92%{opacity:0;transform:translateY(-8px)}96%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.reveal,.pulse,.blink,.scan,.flow,.orbit,.radar,.role{animation:none!important;opacity:1!important;transform:none!important}.r1,.r2,.r3,.r4{display:none!important}}
</style>
<rect x="4" y="4" width="552" height="852" rx="30" fill="#030510" stroke="#19254A"/>
<rect x="11" y="11" width="538" height="838" rx="24" fill="url(#bg)" stroke="#26365F"/>
<rect x="12" y="12" width="536" height="836" rx="23" fill="url(#aura)"/>
<circle cx="36" cy="36" r="5" fill="#FF5F57"/>
<circle cx="54" cy="36" r="5" fill="#FEBC2E"/>
<circle cx="72" cy="36" r="5" fill="#00FFA3"/>
<text x="96" y="41" fill="#91A4C5" font-size="12" letter-spacing="1.35">system.status / decorative visual</text>
<line x1="24" y1="58" x2="536" y2="58" stroke="#223259"/>
<rect class="scan" x="24" y="59" width="150" height="1" fill="url(#brand)" opacity="0"/>
<rect x="28" y="78" width="504" height="350" rx="22" fill="#091126" stroke="#2D3B68"/>
<text x="50" y="110" fill="#FF4ECD" font-size="9" font-weight="700" letter-spacing="0.7" class="reveal" style="animation-delay:0.12s">DECORATIVE / SECURITY RADAR</text>
<circle cx="280" cy="266" r="41.25" fill="none" stroke="#33436F" stroke-opacity=".7"/>
<circle cx="280" cy="266" r="82.5" fill="none" stroke="#33436F" stroke-opacity=".7"/>
<circle cx="280" cy="266" r="125" fill="none" stroke="#33436F" stroke-opacity=".7"/>
<line x1="155" y1="266" x2="405" y2="266" stroke="#27375F"/>
<line x1="280" y1="141" x2="280" y2="391" stroke="#27375F"/>
<path class="radar" d="M280 266 L280 141 A125 125 0 0 1 390 223.5 Z" fill="#00E5FF" fill-opacity=".12" stroke="#00E5FF" stroke-opacity=".5"/>
<circle class="pulse" cx="220" cy="234.75" r="5" fill="#FF4ECD" filter="url(#glow)"/>
<text x="230" y="226.75" fill="#FF4ECD" font-size="8" font-weight="700" letter-spacing="0.45">SIEM</text>
<circle class="pulse" cx="332.5" cy="208.5" r="5" fill="#00E5FF" filter="url(#glow)"/>
<text x="342.5" y="200.5" fill="#00E5FF" font-size="8" font-weight="700" letter-spacing="0.45">NETWORK</text>
<circle class="pulse" cx="315" cy="318.5" r="5" fill="#00FFA3" filter="url(#glow)"/>
<text x="325" y="310.5" fill="#00FFA3" font-size="8" font-weight="700" letter-spacing="0.45">ENDPOINT</text>
<text x="128" y="407" fill="#65769E" font-size="9" class="reveal" style="animation-delay:0.70s">visual motif · not live telemetry</text>
<rect x="28" y="448" width="504" height="362" rx="22" fill="#0A1227" stroke="#2D3B68"/>
<text x="50" y="484" fill="#00FFA3" font-size="10" font-weight="700" letter-spacing="1.1" class="reveal" style="animation-delay:0.15s">CURRENTLY BUILDING</text>
<text x="50" y="535" fill="#00E5FF" font-size="10" font-weight="700" class="reveal" style="animation-delay:0.28s">01</text>
<text x="88" y="535" fill="#EAF4FF" font-size="12" font-weight="700" class="reveal" style="animation-delay:0.32s">SECURE AI APPLICATIONS</text>
<text x="88" y="558" fill="#91A4C5" font-size="10" class="reveal" style="animation-delay:0.37s">Security-aware rapid prototypes.</text>
<text x="50" y="607" fill="#9D4EDD" font-size="10" font-weight="700" class="reveal" style="animation-delay:0.40s">02</text>
<text x="88" y="607" fill="#EAF4FF" font-size="12" font-weight="700" class="reveal" style="animation-delay:0.44s">AGENTIC AUTOMATION</text>
<text x="88" y="630" fill="#91A4C5" font-size="10" class="reveal" style="animation-delay:0.49s">LLMs, MCP, n8n, and APIs.</text>
<text x="50" y="679" fill="#FF4ECD" font-size="10" font-weight="700" class="reveal" style="animation-delay:0.52s">03</text>
<text x="88" y="679" fill="#EAF4FF" font-size="12" font-weight="700" class="reveal" style="animation-delay:0.56s">CYBERSECURITY PRACTICE</text>
<text x="88" y="702" fill="#91A4C5" font-size="10" class="reveal" style="animation-delay:0.61s">SIEM monitoring and network labs.</text>
<text x="50" y="775" fill="#00E5FF" font-size="10" font-weight="700" class="reveal" style="animation-delay:0.82s">BUILD SMARTER · AUTOMATE FASTER · THINK SECURELY</text>
</svg>
